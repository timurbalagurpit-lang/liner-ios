name: iOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Archive unsigned app
        working-directory: ios/App
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        working-directory: ios/App
        run: |
          set -euo pipefail
          APP="build/App.xcarchive/Products/Applications/App.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Archive did not contain App.app"
            find build/App.xcarchive -maxdepth 4 -print
            exit 1
          fi
          rm -rf Payload liner-ios-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry -X liner-ios-unsigned.ipa Payload
          unzip -l liner-ios-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: liner-ios-unsigned
          path: ios/App/liner-ios-unsigned.ipa
          if-no-files-found: error
