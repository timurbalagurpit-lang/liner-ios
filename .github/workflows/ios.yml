name: iOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.hkamori.liner
    steps:
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Decode signing files
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: |
          set -euo pipefail
          if printf '' | base64 --decode >/dev/null 2>&1; then
            B64_FLAG=--decode
          else
            B64_FLAG=-D
          fi
          printf '%s' "$IOS_P12_BASE64" | base64 "$B64_FLAG" > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$IOS_PROVISION_BASE64" | base64 "$B64_FLAG" > "$RUNNER_TEMP/profile.mobileprovision"
          ls -l "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision"

      - name: Preflight secrets and bundle id
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          chmod +x scripts/ios-secrets-check.sh
          ./scripts/ios-secrets-check.sh "$RUNNER_TEMP/profile.mobileprovision"

      - name: Detect provisioning profile
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$PLIST"

          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PLIST")"
          GET_TASK_ALLOW="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PLIST" 2>/dev/null || echo false)"
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$PLIST" >/dev/null 2>&1; then
            HAS_DEVICES=yes
          else
            HAS_DEVICES=no
          fi

          if [ "$GET_TASK_ALLOW" = "true" ]; then
            PROFILE_KIND=development
            EXPORT_METHOD=debugging
            LEGACY_METHOD=development
          elif [ "$HAS_DEVICES" = "yes" ]; then
            PROFILE_KIND=ad-hoc
            EXPORT_METHOD=release-testing
            LEGACY_METHOD=ad-hoc
          else
            echo "::error::Profile '$PROFILE_NAME' has no ProvisionedDevices and get-task-allow is not true. Use an ad-hoc or development profile; App Store profiles cannot be sideloaded."
            exit 1
          fi

          echo "::notice::Profile: $PROFILE_NAME | team: $TEAM_ID | kind: $PROFILE_KIND | get-task-allow: $GET_TASK_ALLOW | ProvisionedDevices: $HAS_DEVICES"
          echo "::notice::exportOptions method: $EXPORT_METHOD (Xcode 26 name; legacy '$LEGACY_METHOD' is deprecated)"
          printf 'PROFILE_NAME=%s\n' "$PROFILE_NAME" >> "$GITHUB_ENV"
          printf 'PROFILE_KIND=%s\n' "$PROFILE_KIND" >> "$GITHUB_ENV"
          printf 'TEAM_ID=%s\n' "$TEAM_ID" >> "$GITHUB_ENV"
          printf 'EXPORT_METHOD=%s\n' "$EXPORT_METHOD" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        run: |
          set -euo pipefail
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$DEST/$UUID.mobileprovision"
          echo "Installed profile $PROFILE_NAME ($UUID)"

      - name: Import signing certificate
        env:
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"$//')
          security find-identity -v -p codesigning "$KEYCHAIN" | tee "$RUNNER_TEMP/identities.txt"

          IDENTITIES="$(sed -nE 's/^[[:space:]]*[0-9]+\) [0-9A-F]+ "(.*)"$/\1/p' "$RUNNER_TEMP/identities.txt")"
          if [ -z "$IDENTITIES" ]; then
            echo "::error::No code signing identity found in the imported .p12."
            exit 1
          fi

          if [ "$EXPORT_METHOD" = "debugging" ]; then
            IDENTITY="$(printf '%s\n' "$IDENTITIES" | grep -E 'Apple Development|iPhone Developer' | head -n1 || true)"
          else
            IDENTITY="$(printf '%s\n' "$IDENTITIES" | grep -E 'Apple Distribution|iPhone Distribution' | head -n1 || true)"
          fi

          if [ -z "$IDENTITY" ]; then
            echo "::error::No identity matching profile kind '$PROFILE_KIND' in the .p12. Found: $IDENTITIES"
            exit 1
          fi

          printf 'CODE_SIGN_IDENTITY=%s\n' "$IDENTITY" >> "$GITHUB_ENV"
          echo "::notice::Signing identity: $IDENTITY"

      - name: Write export options
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingCertificate</key>
            <string>${CODE_SIGN_IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          cat "$RUNNER_TEMP/exportOptions.plist"

      - name: Archive
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"
          ls -l "$RUNNER_TEMP/export"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: liner-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
